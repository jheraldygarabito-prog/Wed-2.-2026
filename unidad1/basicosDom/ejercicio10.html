<!DOCTYPE html>
<html lang="en">
<head>    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICO 10 USO DE APPEDCHILD</title>
</head>
<body>
    <div id="contenedor">CONTENERDOR INICIAL</div>
    <button id="boton">AGREGAR ELEMENTO</button>
    <script>
       const nuevo_elemento=document.createElement('div');//para crear un elemento nuevo
       nuevo_elemento.textContent='Elemento creado con dom';//para agregarle texto
       const contenedor=document.getElementById('contenedor');
       console.log(contenedor);
       contenedor.appendChild(nuevo_elemento);//crea un nuevo hijo
    </script>
</body>
</html>
