<!DOCTYPE html>
<html lang="en">
<head>    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 cambio de contenido con textContent </title>
</head>
<body>
    <div id="elemento1">Texto</div>
    <script>
        const elemento1 = document.getElementById('elemento1');
        elemento1.textContent = 'nuevo texto';
        elemento1.style.color = 'red';
    </script>
</body>
</html>
